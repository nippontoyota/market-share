name: Daily Vahan Dashboard Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "MASTER_DATA_2026.xlsm"
      - "RTO_2025_2026_Combined.csv"
      - "rto_data.json"
      - "index.html"
      - "VAHAN_KERALA_MASTER1.xlsm"
      - "automation/**"
      - "tests/**"
      - ".github/workflows/vahan-daily.yml"
  schedule:
    - cron: "30 3 * * *"

concurrency:
  group: vahan-daily-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the deployment branch
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Check Vahan portal reachability
        id: vahan_reachability
        if: github.event_name != 'push'
        shell: bash
        run: |
          if python automation/check_vahan_connectivity.py --attempts 2 --timeout 15; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vahan portal is not reachable from the free GitHub-hosted runner. Production data will remain on the last validated snapshot."
          fi

      - name: Compile lightweight validation scripts
        run: python -m py_compile automation/config.py automation/validate_dashboard_data.py automation/check_vahan_connectivity.py

      - name: Validate last production snapshot when Vahan is unreachable
        if: github.event_name != 'push' && steps.vahan_reachability.outputs.reachable != 'true'
        run: python automation/validate_dashboard_data.py

      - name: Set up Node.js
        if: github.event_name == 'push' || steps.vahan_reachability.outputs.reachable == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        if: github.event_name == 'push' || steps.vahan_reachability.outputs.reachable == 'true'
        run: npm ci

      - name: Install Python dependencies
        if: github.event_name == 'push' || steps.vahan_reachability.outputs.reachable == 'true'
        run: python -m pip install -r automation/requirements.txt

      - name: Install Playwright Chromium
        if: github.event_name != 'push' && steps.vahan_reachability.outputs.reachable == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Run automation tests
        if: github.event_name == 'push' || steps.vahan_reachability.outputs.reachable == 'true'
        run: npm run test:automation

      - name: Compile full automation scripts
        if: github.event_name == 'push' || steps.vahan_reachability.outputs.reachable == 'true'
        run: python -m py_compile automation/config.py automation/download_reports.py automation/dashboard_integration.py automation/run_full_pipeline.py automation/validate_dashboard_data.py automation/check_vahan_connectivity.py

      - name: Check dashboard generator syntax
        if: github.event_name == 'push' || steps.vahan_reachability.outputs.reachable == 'true'
        run: node --check generate_rto_data.js

      - name: Download and integrate Vahan data
        if: github.event_name != 'push' && steps.vahan_reachability.outputs.reachable == 'true'
        env:
          TZ: Asia/Kolkata
        run: python automation/run_full_pipeline.py

      - name: Validate production dashboard data
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python automation/validate_dashboard_data.py
          elif [ "${{ steps.vahan_reachability.outputs.reachable }}" != "true" ]; then
            python automation/validate_dashboard_data.py
          else
            python automation/validate_dashboard_data.py --require-vahan-workbook
          fi

      - name: Check generated data files
        if: github.event_name == 'push' || steps.vahan_reachability.outputs.reachable == 'true'
        run: git diff --check

      - name: Commit validated dashboard data
        if: github.event_name != 'push' && steps.vahan_reachability.outputs.reachable == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VAHAN_KERALA_MASTER1.xlsm MASTER_DATA_2026.xlsm RTO_2025_2026_Combined.csv rto_data.json index.html
          if git diff --cached --quiet; then
            echo "No dashboard data changes detected."
          else
            git commit -m "chore: refresh Vahan dashboard data"
            git push origin HEAD:master
          fi
